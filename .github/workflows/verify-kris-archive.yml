name: Verify Kris archive

on:
  push:
    paths:
      - "archive/kris-project-2026-08-23/**"
      - "messages12.html"
      - ".github/workflows/verify-kris-archive.yml"
  pull_request:
    paths:
      - "archive/kris-project-2026-08-23/**"
      - "messages12.html"
      - ".github/workflows/verify-kris-archive.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 archive/kris-project-2026-08-23/tools/verify_archive.py
