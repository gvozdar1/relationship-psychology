name: Render Book 1 Part 01 with Fish Audio

on:
  push:
    paths:
      - '.github/workflows/render-book1-part01-fish.yml'
      - 'narrative/audio_tools/render_fish_book1.py'
      - 'narrative/audio_scripts/BOOK1_01_FAMILY_CONNECTION_FISH.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-book1-part01-fish
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install requests pydub

      - name: Render actual Fish Audio files
        env:
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$FISH_API_KEY"
          python narrative/audio_tools/render_fish_book1.py \
            narrative/audio_scripts/BOOK1_01_FAMILY_CONNECTION_FISH.md \
            narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.mp3 \
            narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.wav
          test -s narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.mp3
          test -s narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.wav

      - name: Commit rendered audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.mp3 \
                  narrative/audio/pantheon/book1/Pantheon_BOOK1_P01_FAMILY_CONNECTION_FINAL.wav
          git diff --cached --quiet && exit 0
          git commit -m 'audio: render Book 1 part 01 Family Connection with Fish'
          git push
