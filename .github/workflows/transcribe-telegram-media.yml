name: Transcribe Telegram media

on:
  pull_request:
    paths:
      - 'tools/telegram-media-transcriber/run-input/**'
      - '.github/workflows/transcribe-telegram-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake g++

      - name: Build whisper.cpp and download multilingual small model
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --config Release -j2
          CLI="$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli"
          test -x "$CLI"
          bash "$RUNNER_TEMP/whisper.cpp/models/download-ggml-model.sh" small
          MODEL="$RUNNER_TEMP/whisper.cpp/models/ggml-small.bin"
          test -s "$MODEL"
          echo "WHISPER_CLI=$CLI" >> "$GITHUB_ENV"
          echo "WHISPER_MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Reassemble and decode uploaded audio bundle
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/input" transcripts
          cat tools/telegram-media-transcriber/run-input/part_*.b64 \
            | tr -d '\n\r ' \
            | base64 -d > "$RUNNER_TEMP/input/aug6_all.ogg"
          echo '44de110cbc9634033219681443065832b102a348a161223375634556294e52f6  '"$RUNNER_TEMP/input/aug6_all.ogg" | sha256sum -c -
          ffmpeg -y -v error -i "$RUNNER_TEMP/input/aug6_all.ogg" -ac 1 -ar 16000 -c:a pcm_s16le "$RUNNER_TEMP/input/aug6_all.wav"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/input/aug6_all.wav"

      - name: Transcribe Russian speech
        run: |
          set -euxo pipefail
          "$WHISPER_CLI" \
            -m "$WHISPER_MODEL" \
            -f "$RUNNER_TEMP/input/aug6_all.wav" \
            -l ru \
            -oj -otxt \
            -of transcripts/aug6_all \
            2>&1 | tee transcripts/whisper.log
          ls -lah transcripts

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-transcripts
          path: transcripts/
          if-no-files-found: warn
          retention-days: 3
