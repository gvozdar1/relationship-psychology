name: Transcribe Telegram media

on:
  push:
    branches:
      - tool-telegram-media-transcriber
    paths:
      - 'tools/telegram-media-transcriber/run-input/**'
      - '.github/workflows/transcribe-telegram-media.yml'
  pull_request:
    paths:
      - 'tools/telegram-media-transcriber/run-input/**'
      - '.github/workflows/transcribe-telegram-media.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ffmpeg and build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y ffmpeg cmake g++

      - name: Build whisper.cpp and download multilingual large-v3-turbo model
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git "$RUNNER_TEMP/whisper.cpp"
          cmake -S "$RUNNER_TEMP/whisper.cpp" -B "$RUNNER_TEMP/whisper.cpp/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/whisper.cpp/build" --config Release -j2
          CLI="$RUNNER_TEMP/whisper.cpp/build/bin/whisper-cli"
          test -x "$CLI"
          bash "$RUNNER_TEMP/whisper.cpp/models/download-ggml-model.sh" large-v3-turbo
          MODEL="$RUNNER_TEMP/whisper.cpp/models/ggml-large-v3-turbo.bin"
          test -s "$MODEL"
          echo "WHISPER_CLI=$CLI" >> "$GITHUB_ENV"
          echo "WHISPER_MODEL=$MODEL" >> "$GITHUB_ENV"

      - name: Reassemble and decode uploaded audio bundle
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/input" transcripts
          cat tools/telegram-media-transcriber/run-input/part_*.b64 \
            | tr -d '\n\r ' \
            | base64 -d > "$RUNNER_TEMP/input/aug6_all.ogg"
          echo "decoded bytes: $(wc -c < "$RUNNER_TEMP/input/aug6_all.ogg")"
          echo "decoded sha256: $(sha256sum "$RUNNER_TEMP/input/aug6_all.ogg" | cut -d' ' -f1)"
          ffmpeg -y -v warning -i "$RUNNER_TEMP/input/aug6_all.ogg" -ac 1 -ar 16000 -c:a pcm_s16le "$RUNNER_TEMP/input/aug6_all.wav"
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$RUNNER_TEMP/input/aug6_all.wav"

      - name: Split bundle back into six Telegram circles
        run: |
          set -euxo pipefail
          SRC="$RUNNER_TEMP/input/aug6_all.wav"
          ffmpeg -y -v error -i "$SRC" -ss 0.000000  -t 9.406688  -c:a pcm_s16le transcripts/circle_1.wav
          ffmpeg -y -v error -i "$SRC" -ss 10.406688 -t 8.553313  -c:a pcm_s16le transcripts/circle_2.wav
          ffmpeg -y -v error -i "$SRC" -ss 19.960001 -t 41.833313 -c:a pcm_s16le transcripts/circle_3.wav
          ffmpeg -y -v error -i "$SRC" -ss 62.793314 -t 8.425313  -c:a pcm_s16le transcripts/circle_4.wav
          ffmpeg -y -v error -i "$SRC" -ss 72.218627 -t 17.705313  -c:a pcm_s16le transcripts/circle_5.wav
          ffmpeg -y -v error -i "$SRC" -ss 90.923940 -t 11.369313 -c:a pcm_s16le transcripts/circle_6.wav
          for f in transcripts/circle_*.wav; do
            printf '%s ' "$f"
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$f"
          done

      - name: Transcribe each circle independently in Russian with hints
        run: |
          set -euxo pipefail
          : > transcripts/bundle.txt
          HINT='Крис, Кристина, Гвоздарь, Евгений, Юра, Никита, Минск, Бобруйск, больница, клиника, маршрутка'
          for n in 1 2 3 4 5 6; do
            f="transcripts/circle_${n}.wav"
            out="transcripts/circle_${n}"
            "$WHISPER_CLI" \
              -m "$WHISPER_MODEL" \
              -f "$f" \
              -l ru \
              -t 4 \
              --prompt "$HINT" \
              -otxt -osrt -oj \
              -of "$out" \
              2>&1 | tee "transcripts/circle_${n}.log"
            printf '\n===== CIRCLE %s =====\n' "$n" >> transcripts/bundle.txt
            cat "${out}.txt" >> transcripts/bundle.txt
          done
          cat transcripts/bundle.txt
          ls -lah transcripts

      - name: Upload transcripts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-circles-large-v3-turbo
          path: transcripts/
          if-no-files-found: warn
          retention-days: 3
