name: Render Pantheon Part 01

on:
  push:
    paths:
      - '.github/workflows/render-pantheon-part01.yml'
      - 'narrative/audio_tools/render_pantheon.py'
      - 'narrative/audio_scripts/01_GENEALOGICAL_PANIC_AUDIO.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak
          python -m pip install --upgrade pip
          pip install edge-tts pydub
      - name: Render actual audio files
        run: |
          python narrative/audio_tools/render_pantheon.py \
            narrative/audio_scripts/01_GENEALOGICAL_PANIC_AUDIO.md \
            narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.mp3 \
            narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.wav
          test -s narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.mp3
          test -s narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.wav
      - name: Commit rendered audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.mp3 \
                  narrative/audio/pantheon/Pantheon_S01_P01_GENEALOGICAL_PANIC_FINAL.wav
          git diff --cached --quiet && exit 0
          git commit -m 'audio: render Pantheon part 01'
          git push

